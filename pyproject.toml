[project]
name = "rag-bench"
version = "0.1.0"
description = "Reproducible benchmark for RAG pipelines: plug in your retriever, reranker, generator, chunker; get honest, comparable numbers across QA, multi-hop, summarization, noise, and counterfactual robustness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "rag-bench contributors" }]
keywords = ["rag", "retrieval", "benchmark", "evaluation", "llm", "ir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "duckdb>=0.10",
    "numpy>=1.26",
    "scipy>=1.12",
    "rich>=13.7",
    "click>=8.1",
    "tqdm>=4.66",
    "datasets>=2.18",
    "huggingface_hub>=0.22",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
retrievers = [
    "bm25s>=0.1.10",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]
rerankers = [
    "sentence-transformers>=3.0",
]
generators = [
    "anthropic>=0.34",
    "openai>=1.40",
    "google-generativeai>=0.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
all = ["rag-bench[retrievers,rerankers,generators,dev]"]

[project.scripts]
rag-bench = "rag_bench.cli:main"

[project.urls]
Homepage = "https://github.com/airine/rag-bench"
Documentation = "https://github.com/airine/rag-bench/tree/main/docs"
Issues = "https://github.com/airine/rag-bench/issues"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "RUF"]
# RUF001-003: we use Greek letters (α) and math symbols (‖ × ↔ →) intentionally
# in docstrings; they are part of the methodology vocabulary.
# E501: line length — long URLs and reference citations make a hard limit unhelpful.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "smoke: marks tests as smoke tests for CI",
    "needs_gpu: marks tests that require a GPU",
    "needs_network: marks tests that hit external services",
]
