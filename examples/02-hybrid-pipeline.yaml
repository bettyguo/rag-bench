# Hybrid retrieval (BM25 + BGE-small) with cross-encoder rerank and an
# anthropic generator. Requires:
#   pip install rag-bench[retrievers,rerankers,generators]
#   export ANTHROPIC_API_KEY=...

pipeline:
  name: hybrid-bge-rerank-claude
  retriever_top_k: 50
  reranker_top_k: 10

  chunker:
    type: recursive
    chunk_size: 1000
    overlap: 200

  retriever:
    type: hybrid
    rrf_k: 60
    top_k: 50
    sparse:
      type: bm25
      k1: 1.5
      b: 0.75
      top_k: 100
    dense:
      type: dense
      model: BAAI/bge-small-en-v1.5
      normalize: true
      top_k: 100

  reranker:
    type: cross-encoder
    model: BAAI/bge-reranker-v2-m3
    top_k: 10

  generator:
    type: anthropic
    model: claude-haiku-4-5
    temperature: 0
    max_tokens: 512
    prompt_template: default
