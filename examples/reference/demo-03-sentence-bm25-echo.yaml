# Demo pipeline #3: sentence-chunked BM25 + echo generator.
# Demonstrates the length_ratio sanity-check metric in action — echo emits the
# whole chunk so length_ratio is high and gets flagged as `verbose`.

pipeline:
  name: demo-sentence-bm25-echo
  retriever_top_k: 10
  reranker_top_k: 3

  chunker:
    type: sentence
    chunk_size: 400
    overlap_sentences: 1

  retriever:
    type: bm25
    k1: 1.5
    b: 0.75
    top_k: 10

  reranker:
    type: identity
    top_k: 3

  generator:
    type: echo
