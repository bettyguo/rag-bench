# Reference pipeline #3: hybrid BM25 + BGE-small with RRF fusion.
# Local model; requires `pip install rag-bench[retrievers]`.

pipeline:
  name: ref-03-hybrid-bm25-bge-extractive
  retriever_top_k: 50
  reranker_top_k: 5

  chunker:
    type: recursive
    chunk_size: 1000
    overlap: 200

  retriever:
    type: hybrid
    rrf_k: 60
    top_k: 50
    sparse:
      type: bm25
      k1: 1.5
      b: 0.75
      top_k: 100
    dense:
      type: dense
      model: BAAI/bge-small-en-v1.5
      normalize: true
      top_k: 100
      batch_size: 32

  reranker:
    type: identity
    top_k: 5

  generator:
    type: extractive
