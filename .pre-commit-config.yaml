# Match CI exactly: ruff (lint + format) + pytest fast-path.
# Install: `pip install pre-commit && pre-commit install`
# Run manually: `pre-commit run --all-files`

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: \.jsonl$  # JSONL files are line-sensitive
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (offline tests)
        entry: pytest tests/ -q -x
        language: system
        pass_filenames: false
        stages: [pre-push]
